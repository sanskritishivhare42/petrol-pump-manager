{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width:500px;margin:40px auto;">

    <h2>Change Password</h2>

    <form method="POST">

        <div class="password-box">
            <label>Current Password</label>

            <div style="display:flex;gap:8px;">
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    required
                    style="flex:1;"
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('current_password', this)"
                >
                    👁 Show
                </button>
            </div>
        </div>


        <div class="password-box">
            <label>New Password</label>

            <div style="display:flex;gap:8px;">
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    minlength="6"
                    required
                    style="flex:1;"
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('new_password', this)"
                >
                    👁 Show
                </button>
            </div>

            <small>Minimum 6 characters</small>
        </div>


        <div class="password-box">
            <label>Confirm New Password</label>

            <div style="display:flex;gap:8px;">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    minlength="6"
                    required
                    style="flex:1;"
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirm_password', this)"
                >
                    👁 Show
                </button>
            </div>
        </div>


        <button type="submit" style="margin-top:15px;">
            Change Password
        </button>

    </form>

</div>


<style>

.password-box {
    margin-bottom: 20px;
}

.password-box label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.show-password {
    white-space: nowrap;
    cursor: pointer;
}

</style>


<script>

function togglePassword(fieldId, button) {

    const field = document.getElementById(fieldId);

    if (field.type === "password") {

        field.type = "text";
        button.innerHTML = "🙈 Hide";

    } else {

        field.type = "password";
        button.innerHTML = "👁 Show";

    }

}

</script>

{% endblock %}
