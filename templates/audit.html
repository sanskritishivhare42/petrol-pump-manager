{% extends "base.html" %}{% block content %}
<h1>Audit Log</h1>
<div class="table-wrap"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>
{% for l in logs %}<tr><td>{{l.created_at.strftime('%Y-%m-%d %H:%M:%S')}}</td><td>{{l.user.name}}</td><td>{{l.action}}</td><td>{{l.details}}</td></tr>{% endfor %}
</table></div>
{% endblock %}
