{% extends "base.html" %}{% block content %}
<h1>User Management</h1>
<form method="post" class="form-grid">
<label>Name<input name="name" required></label>
<label>Username<input name="username" required></label>
<label>Password<input type="password" name="password" required></label>
<label>Role<select name="role"><option>EMPLOYEE</option><option>ADMIN</option></select></label>
<button class="btn">Create User</button>
</form>
<div class="table-wrap"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th></tr>
{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{"Active" if u.active else "Disabled"}}</td></tr>{% endfor %}
</table></div>
{% endblock %}
